<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"><meta name="theme-color" content="#101936"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="광안"><title>광안 | 3D 야경 해변</title><link rel="stylesheet" href="/style.css"><script type="importmap">{"imports":{"three":"/three/three.module.js"}}</script></head><body>
<section id="landing" class="screen landing"><div class="logo"><svg viewBox="0 0 280 80"><path d="M12 65H268M73 14V69M207 14V69M12 63Q73 65 73 14Q140 100 207 14Q207 65 268 63" fill="none" stroke="currentColor" stroke-width="2.7"/><path d="M73 14L40 64M73 14L105 64M207 14L173 64M207 14L240 64" stroke="currentColor" opacity=".6"/></svg><h1>광안</h1><p>GWANGAN</p><span>바다 앞에서 잠깐 쉬어가요</span></div><div class="landing-bottom"><button class="primary" id="start">광안리 입장하기</button><button class="link" id="renameLanding">닉네임 재설정</button></div></section>
<section id="setup" class="screen modal hidden"><div class="panel"><h2>광안에 오신 걸 환영해요</h2><p>사람처럼 움직이는 3D 캐릭터를 골라주세요.</p><input id="nick" maxlength="3" placeholder="닉네임 · 최대 3글자"><div class="gender-row"><button class="gender selected" data-gender="male"><span>👦🏻</span>남자 · 짧은 머리</button><button class="gender" data-gender="female"><span>👧🏻</span>여자 · 긴 머리</button></div><button class="primary" id="enter">입장하기</button><button class="link" id="back">뒤로</button><p class="error" id="error"></p></div></section>
<main id="game" class="hidden"><div id="view"></div><div class="top-left"><div class="brand">광안 <small>GWANGAN</small></div><div class="info"><span id="weather">🌙 밤 · 맑음</span><span id="population">실제 접속 0명</span><span id="channel">해변 1</span></div></div><div class="top-right"><button id="audioStatus" type="button" title="배경음악 끄기" aria-label="배경음악 끄기" aria-pressed="true">🔊</button><button id="photo" title="사진 저장">📷<small>사진</small></button></div><div id="showBanner" class="banner hidden">🎆 광안 상설 야간 축제 <button id="watch">감상하기</button> <button id="wish">⛵ 종이배</button></div><div id="actions" class="actions"><button data-action="heart">❤️<small>하트</small></button><button data-action="wave">👋<small>인사</small></button><button data-action="dance">💃<small>춤</small></button><button data-action="cheer">🙌<small>응원</small></button><button data-action="sit">🪑<small>앉기</small></button><button data-action="meditate">🌊<small>바다멍</small></button></div><button id="exit" class="exit hidden">✕ 힐링 모드 종료</button><div id="toast" class="toast hidden"></div><div id="boatMessage" class="boat-message hidden" aria-live="polite"></div></main>

<section id="wishModal" class="screen modal hidden"><div class="panel"><h2>⛵ 소원 종이배</h2><p id="wishInfo">언제든 소원 종이배를 무제한으로 띄울 수 있어요.</p><label class="wish-message-label" for="wishMessage">바다에 전할 짧은 메시지 (최대 30자)</label><input id="wishMessage" maxlength="30" placeholder="오늘도 좋은 하루 보내요" autocomplete="off"><div class="wish-grid"><button data-wish="행복">🍀 행복</button><button data-wish="건강">💗 건강</button><button data-wish="사랑">💕 사랑</button><button data-wish="행운">⭐ 행운</button></div><button class="link" data-close="wishModal">닫기</button></div></section>
<script src="/socket.io/socket.io.js"></script><script type="module" src="/game.js"></script></body></html>
